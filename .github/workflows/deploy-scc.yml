name: Deploy SCC only (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: medastare-scc-deploy
  cancel-in-progress: false
jobs:
  deploy-scc:
    runs-on: ubuntu-latest
    environment: scc-production
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud without a JSON key
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.SCC_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SCC_DEPLOY_SERVICE_ACCOUNT }}
          project_id: medastare-502e6
          create_credentials_file: true
          export_environment_variables: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install SCC dependencies
        working-directory: scc-functions
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Deploy SCC function only
        run: firebase deploy --project medastare-502e6 --config firebase.scc.json --only functions:scc:sccEnroll --non-interactive
